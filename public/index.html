<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>WebMCP 通路測試</title>
  </head>
    <body>
        <h1>CoPlan — 共享行程</h1>
        <p id="status">連線中…</p>
        <p id="mcp">偵測 WebMCP…</p>


        <fieldset>
            <legend>新增行程</legend>
            <select id="type">
            <option>景點</option>
            <option>餐廳</option>
            <option>交通</option>
            <option>住宿</option>
            </select>
            <select id="day">
            <option value="1">Day 1</option>
            <option value="2">Day 2</option>
            <option value="3">Day 3</option>
            </select>
            <input id="start" type="time" value="09:00" />
            <input id="end" type="time" value="11:00" />
            <input id="title" placeholder="行程名稱" />
            <button id="add">新增</button>
        </fieldset>

        
        <p>房間成員：<span id="members"></span></p>
        <div id="board"></div>
        <h3>Agent 活動時間軸</h3>
        <div id="timeline"></div>

        <script>
            // ═══ ① 連線層 ═══
                // ═══ ① 從網址讀房號與身分 ═══
            // 網址格式：/r/<房號>?as=<暱稱>   例如 /r/tokyo?as=Cindy
            const path = location.pathname.match(/^\/r\/([\w-]+)/);
            const roomId = path ? path[1] : "lobby";
            const myName = new URLSearchParams(location.search).get("as") || "匿名旅伴";

            const proto = location.protocol === "https:" ? "wss" : "ws";
            const ws = new WebSocket(`${proto}://${location.host}/api/room/${roomId}`);


            const status = document.getElementById("status");  
            const board = document.getElementById("board"); 
            let items = [];   
            let members = {};
            let log = [];

            ws.onopen = () => {
                status.textContent = "✅ 已連線";
                ws.send(JSON.stringify({ t: "join", name: me() }));
                };
            ws.onclose = () => { status.textContent = "❌ 連線中斷"; };
            ws.onmessage = (event) => {
                const state = JSON.parse(event.data);
                items = state.items;
                log = state.log;
                members = state.members || {};
                render();
                renderLog();
                renderMembers();
                };
            // ═══ ② 身分：接縫函式，之後要換成登入只需改這裡 ═══
            const me = () => myName;

            // ═══ ③ 動作層：唯一入口 ═══
            function addActivity(activity, viaAgent) {
            if (!activity.title) return "行程名稱不能空白。";
            ws.send(JSON.stringify({
                t: "add",
                activity: { ...activity, createdBy: me(), viaAgent }
            }));
            return `已新增「${activity.title}」到 Day ${activity.day} ${activity.start}–${activity.end}。`;
            }

            // ═══ ④ 畫面 ═══
            function render() {
                board.innerHTML = "";
                for (const day of [1, 2, 3]) {
                    const dayItems = items
                    .filter(a => Number(a.day) === day)
                    .sort((a, b) => a.start.localeCompare(b.start));

                    const section = document.createElement("section");
                    section.innerHTML = `<h3>Day ${day}</h3>`;

                    if (dayItems.length === 0) {
                    section.innerHTML += `<p style="color:#888">還沒有安排</p>`;
                    }
                        for (const a of dayItems) {
                            const div = document.createElement("div");
                            const conflicted = a.conflictWith && a.conflictWith.length > 0;
                            div.style.cssText = `border:1px solid ${conflicted ? "#e07b00" : "#ddd"};
                                background:${conflicted ? "#fff4e0" : "#fff"};
                                border-radius:6px;padding:8px;margin:4px 0`;
                            div.innerHTML = `
                                <b>${a.start}–${a.end}</b> ${a.title}
                                <small>［${a.type}］ ${a.createdBy} ${a.viaAgent ? "🤖" : "🙋"}</small>
                                ${conflicted ? `<div style="color:#e07b00;font-size:13px">⚠️ 與其他 ${a.conflictWith.length} 個行程時間重疊</div>` : ""}
                            `;
                            section.appendChild(div);
                            }
                    board.appendChild(section);
                }
            }


            function renderLog() {
                const el = document.getElementById("timeline");
                el.innerHTML = "";
                // 最新的排最上面
                for (const e of [...log].reverse()) {
                    const div = document.createElement("div");
                    div.style.cssText = "border-bottom:1px solid #eee;padding:6px 0;font-size:13px";
                    const time = new Date(e.at).toLocaleTimeString("zh-TW", { hour12: false });
                    div.innerHTML = `
                    <span style="color:#888">${time}</span>
                    <b>${e.viaAgent ? "🤖 " + e.who + " 的 Agent" : "🙋 " + e.who}</b>
                    <code style="background:#f0f0f0;padding:1px 4px">${e.action}</code>
                    ${e.summary}
                    `;
                    el.appendChild(div);
                }
            }


            // 從名字算出固定顏色：同一個名字永遠同色，不需儲存
            const PALETTE = ["#2563eb", "#db2777", "#16a34a", "#ea580c", "#7c3aed", "#0891b2"];
            function colorOf(name) {
            let hash = 0;
            for (const ch of String(name)) hash = (hash * 31 + ch.charCodeAt(0)) % 10000;
            return PALETTE[hash % PALETTE.length];
            }

            function renderMembers() {
            const el = document.getElementById("members");
            el.innerHTML = Object.values(members).map(m =>
                `<span style="color:${colorOf(m.name)};font-weight:bold;margin-right:10px">● ${m.name}</span>`
            ).join("");
            }

            // ═══ ⑤ 介面 A：人的表單 ═══
            document.getElementById("add").onclick = () => {
            const titleEl = document.getElementById("title");
            addActivity({
                type: document.getElementById("type").value,
                day: Number(document.getElementById("day").value),
                start: document.getElementById("start").value,
                end: document.getElementById("end").value,
                title: titleEl.value.trim(),
            }, false);
            titleEl.value = "";
            };

            // ═══ ⑤ 介面 B：Agent 的工具 ═══
            const mcpStatus = document.getElementById("mcp");
            let registered = false;

            setInterval(() => {
            const mc = document.modelContext || navigator.modelContext || window.modelContext;
            mcpStatus.textContent = mc ? "✅ WebMCP 已就緒" : "❌ WebMCP 不可用";
            if (!mc || registered) return;
            registered = true;

            mc.registerTool({
                name: "list_itinerary",
                description: "讀取這個多人共享行程表目前的所有項目，包含天數、時間、名稱、類型與提出者。在新增行程前先呼叫這個，避免與其他人的安排衝突。",
                inputSchema: { type: "object", properties: {} },
                execute: () => ({
                content: [{
                    type: "text",
                    text: items.length
                    ? items.map(a => `Day ${a.day} ${a.start}–${a.end}｜${a.title}［${a.type}］（${a.createdBy}）`).join("\n")
                    : "行程表目前是空的。"
                }]
                })
            });

            mc.registerTool({
                name: "add_activity",
                description: "代表目前使用者，在多人共享的行程表上新增一個項目。所有成員會即時看到。",
                inputSchema: {
                type: "object",
                properties: {
                    type: { type: "string", enum: ["景點", "餐廳", "交通", "住宿"], description: "行程類型" },
                    day: { type: "number", description: "第幾天，從 1 開始" },
                    start: { type: "string", description: "開始時間，24 小時制 HH:MM" },
                    end: { type: "string", description: "結束時間，24 小時制 HH:MM" },
                    title: { type: "string", description: "行程名稱，例如「築地市場」" }
                },
                required: ["type", "day", "start", "end", "title"]
                },
                execute: (a) => ({
                content: [{ type: "text", text: addActivity(a, true) }]
                })
            });
            }, 500);
        </script>
        </body>
</html>
